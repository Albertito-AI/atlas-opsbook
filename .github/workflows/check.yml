name: Verify Opsbook
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:17 and 17:17 Asia/Singapore, before the existing maintenance reviews.
    - cron: '17 9,21 * * *'
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 examples/package_trial.py
      - run: python3 examples/decision_context_trial.py
      - run: python3 examples/reconstruction_trial.py
      - name: Fetch the pinned pstack distribution and verify its complete catalogue
        run: |
          python3 pstack.py fetch
          python3 tests/check_upstream.py
      - name: Assemble combined distribution
        run: |
          python3 bundle.py atlas-opsbook-with-pstack.zip
          sha256sum atlas-opsbook-with-pstack.zip > SHA256SUMS
          unzip -tq atlas-opsbook-with-pstack.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combined-distribution
          retention-days: 7
          path: |
            atlas-opsbook-with-pstack.zip
            SHA256SUMS
  publish-assets:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: combined-distribution
      - name: Attach verified files to this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" atlas-opsbook-with-pstack.zip SHA256SUMS --clobber

